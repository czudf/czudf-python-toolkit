[project]
name = "czudf-toolkit"
version = "0.0.2"
description = "Python toolkit for developing UDFs on the ClickZetta platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[[project.authors]]
name = "guantao.gao"
email = "guantao.gao@clickzetta.com"

[project.urls]
Homepage = "https://github.com/czudf/czudf-python-toolkit"
Issues = "https://github.com/czudf/czudf-python-toolkit/issues"
Repository = "https://github.com/czudf/czudf-python-toolkit"

[dependency-groups]
dev = ["mypy", "pytest", "reuse[charset-normalizer]", "ruff==0.12.11"]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
isort = { combine-as-imports = true, known-first-party = ["czudf"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.build-backend]
module-name = "czudf"
